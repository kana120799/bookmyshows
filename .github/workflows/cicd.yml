name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Concurrency control remains the same for PRs but adjusted for production pushes
  # # Concurrency control to prevent overlapping runs
  # # only one workflow runs at a time for a given pull request. This cancels or queues subsequent runs until the current one finishes.
  # # With cancel-in-progress: true, older runs are canceled when a new commit triggers a run, ensuring only the latest commit is processed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: 20

jobs:
  check-connections:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Cache Vercel CLI
        uses: actions/cache@v4
        id: cache-vercel
        with:
          path: ~/.npm-global
          key: ${{ runner.os }}-vercel-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vercel-

      - name: Install Vercel CLI
        if: steps.cache-vercel.outputs.cache-hit != 'true'
        run: pnpm add -g vercel@latest
        env:
          NPM_CONFIG_PREFIX: ~/.npm-global

      - name: Ensure Vercel CLI is in PATH
        run: echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Cache Prisma Client
        uses: actions/cache@v4
        id: cache-prisma
        with:
          path: node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: Test PostgreSQL Connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma db pull --force

      - name: Install Redis CLI
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      - name: Parse and Sanitize Redis Environment
        env:
          RAW_REDIS_HOST: ${{ secrets.REDIS_HOST }}
          RAW_REDIS_PORT: ${{ secrets.REDIS_PORT }}
          RAW_REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          # Set defaults
          REDIS_HOST="$RAW_REDIS_HOST"
          REDIS_PORT="${RAW_REDIS_PORT:-6379}"
          REDIS_PASSWORD="$RAW_REDIS_PASSWORD"
          REDIS_TLS="false"

          if [ -z "$RAW_REDIS_HOST" ]; then
            echo "::warning::REDIS_HOST secret is empty or not set."
          elif [[ "$RAW_REDIS_HOST" =~ ^rediss?:// ]]; then
            echo "Detected Redis URL format. Parsing components..."
            if [[ "$RAW_REDIS_HOST" =~ ^rediss:// ]]; then
              REDIS_TLS="true"
            fi
            
            # Strip protocol
            PROTO_URL="${RAW_REDIS_HOST#*://}"
            
            # Extract auth part if present
            if [[ "$PROTO_URL" == *"@"* ]]; then
              AUTH_PART="${PROTO_URL%%@*}"
              HOST_PORT="${PROTO_URL#*@}"
              if [[ "$AUTH_PART" == *":"* ]]; then
                REDIS_PASSWORD="${AUTH_PART#*:}"
              else
                REDIS_PASSWORD="$AUTH_PART"
              fi
            else
              HOST_PORT="$PROTO_URL"
            fi
            
            # Extract host and port
            if [[ "$HOST_PORT" == *":"* ]]; then
              REDIS_HOST="${HOST_PORT%%:*}"
              REDIS_PORT="${HOST_PORT#*:}"
              REDIS_PORT="${REDIS_PORT%%/*}"
              REDIS_PORT="${REDIS_PORT%%\?*}"
            else
              REDIS_HOST="$HOST_PORT"
              REDIS_HOST="${REDIS_HOST%%/*}"
              REDIS_HOST="${REDIS_HOST%%\?*}"
            fi
          elif [[ "$RAW_REDIS_HOST" == *":"* ]]; then
            # Format is host:port
            REDIS_HOST="${RAW_REDIS_HOST%%:*}"
            REDIS_PORT="${RAW_REDIS_HOST#*:}"
          fi

          echo "Sanitized Redis host: $REDIS_HOST"
          echo "Sanitized Redis port: $REDIS_PORT"
          echo "Sanitized Redis TLS: $REDIS_TLS"

          # Export to GITHUB_ENV
          echo "REDIS_HOST=$REDIS_HOST" >> $GITHUB_ENV
          echo "REDIS_PORT=$REDIS_PORT" >> $GITHUB_ENV
          echo "REDIS_PASSWORD=$REDIS_PASSWORD" >> $GITHUB_ENV
          echo "REDIS_TLS=$REDIS_TLS" >> $GITHUB_ENV

      - name: Test Redis Connection
        run: |
          if [ -z "$REDIS_HOST" ]; then
            echo "Redis host is empty. Skipping connection check."
            exit 0
          fi
          
          echo "Checking network connectivity to $REDIS_HOST:$REDIS_PORT..."
          CONN_SUCCESS=true
          if ! nc -zv "$REDIS_HOST" "$REDIS_PORT" -w 5; then
            echo "::warning::Network connection failed to $REDIS_HOST:$REDIS_PORT. This is expected if your Redis server is in a private network or behind a firewall."
            CONN_SUCCESS=false
          fi

          if [ "$CONN_SUCCESS" = "true" ]; then
            echo "Network connection succeeded. Attempting Redis ping..."
            CLI_ARGS="-h $REDIS_HOST -p $REDIS_PORT"
            if [ ! -z "$REDIS_PASSWORD" ]; then
              CLI_ARGS="$CLI_ARGS -a $REDIS_PASSWORD"
            fi
            if [ "$REDIS_TLS" = "true" ] || [ "$REDIS_PORT" = "6380" ]; then
              CLI_ARGS="$CLI_ARGS --tls"
            fi
            
            if redis-cli $CLI_ARGS ping; then
              echo "Redis connection verified successfully!"
            else
              echo "Error: Redis CLI ping failed on reachable host. Please verify REDIS_PASSWORD and Redis server configuration."
              exit 1
            fi
          else
            echo "Skipping active Redis ping check because the host is not reachable from this environment."
          fi

  deploy-preview:
    needs: check-connections
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Cache Vercel CLI
        uses: actions/cache@v4
        id: cache-vercel
        with:
          path: ~/.npm-global
          key: ${{ runner.os }}-vercel-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vercel-

      - name: Install Vercel CLI
        if: steps.cache-vercel.outputs.cache-hit != 'true'
        run: pnpm add -g vercel@latest
        env:
          NPM_CONFIG_PREFIX: ~/.npm-global

      - name: Ensure Vercel CLI is in PATH
        run: echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Cache Prisma Client
        uses: actions/cache@v4
        id: cache-prisma
        with:
          path: node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: Generate Prisma Client
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: pnpm prisma generate

      - name: Build Project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    needs: check-connections
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Cache Vercel CLI
        uses: actions/cache@v4
        id: cache-vercel
        with:
          path: ~/.npm-global
          key: ${{ runner.os }}-vercel-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vercel-

      - name: Install Vercel CLI
        if: steps.cache-vercel.outputs.cache-hit != 'true'
        run: pnpm add -g vercel@latest
        env:
          NPM_CONFIG_PREFIX: ~/.npm-global

      - name: Ensure Vercel CLI is in PATH
        run: echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Cache Prisma Client
        uses: actions/cache@v4
        id: cache-prisma
        with:
          path: node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: Generate Prisma Client
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: pnpm prisma generate

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma migrate deploy

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
